# Builds JobSweep-Setup-<version>.exe on Windows and attaches it to the run as a download.
# Pushing a v* tag, or running it by hand with a release tag, also publishes a GitHub release with the .exe.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a GitHub release with this tag (for example v0.0.1). Leave empty to only build.'
        required: false
        default: ''
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: JobSweep-Setup
          path: dist/JobSweep-Setup-*.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JobSweep-Setup
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: JobSweep ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: dist/JobSweep-Setup-*.exe
